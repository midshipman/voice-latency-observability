# Durable Object host Worker. Deploy this FIRST (see docs/DEPLOYMENT.md): the Pages project
# binds its Durable Objects by script name. It serves no routes of its own.
name = "voice-latency-obs-do"
main = "worker.js"
compatibility_date = "2026-10-01"

# Read inside the CallGate Durable Object, so it must live on THIS worker (a var on the
# Pages project does not reach it). 0 = no daily cumulative cap (user decision 2026-10-21 19:36).
# The per-call limit, idle cleanup and single-call lock stay on.
[vars]
DAILY_CALL_CAP_MS = "0"

[[durable_objects.bindings]]
name = "CALLGATE"
class_name = "CallGate"

[[durable_objects.bindings]]
name = "METRICS"
class_name = "MetricsStore"

[[durable_objects.bindings]]
name = "LIVEBUS"
class_name = "LiveBus"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CallGate", "MetricsStore", "LiveBus"]
